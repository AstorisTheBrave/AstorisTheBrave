[project]
name = "astoris-profile"
version = "0.1.0"
description = "Tested tooling for the Astoris GitHub profile"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.17.2",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
