<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title desc">
  <title id="title">Astoris operator notes</title>
  <desc id="desc">A dark terminal-inspired summary showing an SRE career direction, URSA as mature, current work as in progress, and UK time.</desc>
  <style>
    .mono{font-family:ui-monospace,'Cascadia Code','Fira Mono',monospace;font-size:13px}
    .paper{fill:#07070a}.chrome{fill:#1f1d1a}.ink{fill:#ece7dc}.muted{fill:#a8a49b}.faded{fill:#6b6760}.rust{fill:#e27a52}.line{stroke:#2a2724}
    .line1{animation:show .35s .1s both}.line2{animation:show .35s .25s both}.line3{animation:show .35s .4s both}.line4{animation:show .35s .55s both}.line5{animation:show .35s .7s both}.line6{animation:show .35s .85s both}
    @keyframes show{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.line1,.line2,.line3,.line4,.line5,.line6{animation:none!important}}
  </style>
  <rect class="paper" width="760" height="310" rx="9"/>
  <path class="chrome" d="M9 0h742a9 9 0 0 1 9 9v27H0V9a9 9 0 0 1 9-9z"/>
  <line x1="0" y1="36" x2="760" y2="36" class="line"/>
  <circle cx="20" cy="18" r="5" fill="#e06a5a"/><circle cx="39" cy="18" r="5" fill="#d4b15e"/><circle cx="58" cy="18" r="5" fill="#8ca87a"/>
  <text x="380" y="23" text-anchor="middle" class="mono faded">~/field-notes - status</text>
  <g class="mono">
    <text x="28" y="75" class="line1"><tspan class="rust">$</tspan><tspan class="ink"> whoami --direction</tspan></text>
    <text x="28" y="101" class="line2 ink">backend engineer growing into Site Reliability Engineering</text>
    <text x="28" y="127" class="line3"><tspan class="faded">time</tspan><tspan class="ink" x="180">UK time</tspan></text>
    <text x="28" y="153" class="line3"><tspan class="faded">mature</tspan><tspan class="ink" x="180">URSA / released / monitoring in your pocket</tspan></text>
    <text x="28" y="179" class="line4"><tspan class="faded">building</tspan><tspan class="ink" x="180">argus + Rostra / in progress</tspan></text>
    <text x="28" y="221" class="line5"><tspan class="rust">$</tspan><tspan class="ink"> cat reliability.loop</tspan></text>
    <text x="28" y="249" class="line6 ink">observe  →  define  →  automate  →  learn</text>
    <text x="28" y="280" class="line6 muted">make failure visible; keep recovery boring.</text>
  </g>
</svg>
