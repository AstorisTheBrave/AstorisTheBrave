name: metrics

on:
  schedule:
    # twice a day — rank, activity and languages stay fresh without
    # burning Actions minutes.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# serialize runs so the commits below never race each other.
concurrency:
  group: metrics
  cancel-in-progress: false

# we commit the rendered SVGs back to the repo.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # ── languages · its own card, every public repo, % by bytes ──────────
      # The Actions GITHUB_TOKEN only *administers* this repo, but it can still
      # READ public data - so this script aggregates language bytes across all
      # public repos itself, no PAT required. (lowlighter/metrics can't: with
      # the default token it only sees this repo, which is why it showed only
      # HTML.) Runs first so its push is a clean fast-forward.
      - uses: actions/checkout@v4

      - name: render languages
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/render_languages.py

      - name: commit languages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg assets/languages-dark.svg
          git diff --staged --quiet || git commit -m "chore(metrics): refresh languages"
          git push

      # ── card · rank + a full year of activity ────────────────────────────
      - name: card (light)
        uses: lowlighter/metrics@v3.34
        with:
          # GITHUB_TOKEN works out of the box (public data). Add a classic PAT
          # named METRICS_TOKEN (scope: repo, read:user) to include private
          # repos in the card and the language stats — see SETUP.md.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/metrics.svg
          committer_message: "chore(metrics): refresh card (light)"

          config_timezone: Asia/Karachi   # UTC +5
          base: header
          base_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          extras_css: |
            .background  { fill: #f4f0e8 !important; }
            body, .field, .value, .legend, text { color: #1a1a1a !important; }
            h2, .title   { color: #c24e2c !important; }
            .calendar-graph text { fill: #5e5a54 !important; }

      - name: card (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/metrics-dark.svg
          committer_message: "chore(metrics): refresh card (dark)"

          config_timezone: Asia/Karachi
          base: header
          base_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          extras_css: |
            .background  { fill: #07070a !important; }
            body, .field, .value, .legend, text { color: #ece7dc !important; }
            h2, .title   { color: #e27a52 !important; }
            .calendar-graph text { fill: #a8a49b !important; }
