name: metrics

on:
  schedule:
    # twice a day — rank, activity and languages stay fresh without
    # burning Actions minutes.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# metrics commits the rendered SVGs back to the repo via the token.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # ── card · rank + a full year of activity ────────────────────────────
      - name: card (light)
        uses: lowlighter/metrics@v3.34
        with:
          # GITHUB_TOKEN works out of the box (public data). Add a classic PAT
          # named METRICS_TOKEN (scope: repo, read:user) to include private
          # repos in both the card and the language stats — see SETUP.md.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/metrics.svg
          committer_message: "chore(metrics): refresh card (light)"

          config_timezone: Asia/Karachi   # UTC +5
          base: header
          base_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          extras_css: |
            .background  { fill: #f4f0e8 !important; }
            body, .field, .value, .legend, text { color: #1a1a1a !important; }
            h2, .title   { color: #c24e2c !important; }
            .calendar-graph text { fill: #5e5a54 !important; }

      - name: card (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/metrics-dark.svg
          committer_message: "chore(metrics): refresh card (dark)"

          config_timezone: Asia/Karachi
          base: header
          base_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          extras_css: |
            .background  { fill: #07070a !important; }
            body, .field, .value, .legend, text { color: #ece7dc !important; }
            h2, .title   { color: #e27a52 !important; }
            .calendar-graph text { fill: #a8a49b !important; }

      # ── languages · its own card, all repos, % by bytes ──────────────────
      - name: languages (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/languages.svg
          committer_message: "chore(metrics): refresh languages (light)"

          base: ""
          plugin_languages: yes
          # most-used = each language's share of bytes across your repos,
          # straight from GitHub's linguist data. (indepth is intentionally
          # off: it attributes commits per-author and renders "No push
          # activity found" under the default bot token.)
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8
          # This profile repo is HTML and gets an automated bot commit every
          # week (quote + metrics). Skip it so the bar reflects real code,
          # not the automation.
          plugin_languages_skipped: |
            AstorisTheBrave/AstorisTheBrave

          extras_css: |
            .background  { fill: #f4f0e8 !important; }
            body, .field, .value, .legend, text { color: #1a1a1a !important; }
            h2, .title   { color: #c24e2c !important; }

      - name: languages (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/languages-dark.svg
          committer_message: "chore(metrics): refresh languages (dark)"

          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8
          plugin_languages_skipped: |
            AstorisTheBrave/AstorisTheBrave

          extras_css: |
            .background  { fill: #07070a !important; }
            body, .field, .value, .legend, text { color: #ece7dc !important; }
            h2, .title   { color: #e27a52 !important; }
