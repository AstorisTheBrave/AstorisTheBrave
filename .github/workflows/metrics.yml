name: metrics

on:
  schedule:
    # twice a day — rank, languages and the activity calendar stay fresh
    # without burning Actions minutes.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# metrics commits the rendered SVGs back to the repo via the token.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # ── light card · paper & ink ─────────────────────────────────────────
      - name: metrics (light)
        uses: lowlighter/metrics@v3.34
        with:
          # GITHUB_TOKEN works out of the box (public data). Add a classic PAT
          # named METRICS_TOKEN (scope: repo, read:user) to include private
          # contributions — see SETUP.md.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/metrics.svg
          committer_message: "chore(metrics): refresh stats (light)"

          config_timezone: Asia/Karachi   # UTC +5
          base: header
          base_indepth: no

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          extras_css: |
            .background  { fill: #f4f0e8 !important; }
            body, .field, .value, .legend, text { color: #1a1a1a !important; }
            h2, .title   { color: #c24e2c !important; }
            .calendar-graph text { fill: #5e5a54 !important; }

      # ── dark card · matches prefers-color-scheme: dark ───────────────────
      - name: metrics (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: AstorisTheBrave
          filename: assets/metrics-dark.svg
          committer_message: "chore(metrics): refresh stats (dark)"

          config_timezone: Asia/Karachi
          base: header
          base_indepth: no

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          extras_css: |
            .background  { fill: #07070a !important; }
            body, .field, .value, .legend, text { color: #ece7dc !important; }
            h2, .title   { color: #e27a52 !important; }
            .calendar-graph text { fill: #a8a49b !important; }
