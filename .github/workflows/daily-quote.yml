name: daily-quote

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-output
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source

      - name: Check out generated output
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: output
          path: public

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: source/.python-version

      - name: Render quote of the day
        working-directory: source
        run: python -m tools.daily_quote --output-dir ../public

      - name: Publish changed quote to output only
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote.svg quote-dark.svg
          git diff --staged --quiet || git commit -m "chore(profile): rotate daily quote"
          git push origin output
